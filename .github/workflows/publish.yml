# Publishes the catalog on GitHub Pages at every change of main: a zip a
# plugin, and index.json, signed with the catalog key, which Disled checks
# before it shows a plugin or installs it. The key is not the update key of
# Disled: a leak of this one cannot sign an app or a firmware.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time, the last one winning.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

      - name: Sign the index
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.CATALOG_SIGNING_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2.11.5 signer sign dist/index.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
